<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css"
        integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <title>Peg Solitaire Solver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
    <div class="column-container">
        <div class="column-one">
            <div id="board-container" class="board-container">
                Adjust settings to begin
            </div>
        </div>
        <div class="column-two">
            <h2>Settings</h2>
            <div class="size-settings">
                <span>board size: </span>
                <input type="number" min="2" max="10" placeholder="5" id="board_size" onchange="setBoardSize(this.value);">
            </div>
            <div class="state-direction">
                <button disabled="true" id="initial-state" onclick="setInitialState()">Set Initial State</button>
                <button disabled="true" id="goal-state" onclick="setGoalState()">Set Goal State</button>
            </div>
            <div class="state-direction">
                <span>Show search live</span>
                <label class="switch">
                    <input id="live-switch" disabled="true" type="checkbox">
                    <span class="slider round"></span>
                </label>
                <button disabled="true" id="run" onclick="run()">Run</button>
                <button disabled="true" id="reset" onclick="stopSearch()">Reset / cancel</button>

            </div>
            <p id="status" role="status">Choose a board size, then select the initial hole and goal.</p>
            <!-- <div class="run-settings">
                <button disabled="true" id="run" onclick="run()">Run</button>
                <button disabled="true" id="reset" onclick="stopSearch()">Reset / cancel</button>
                <button disabled="true" id="pause">pause</button>
                <button disabled="true" id="left-step">&#8592</button>
                <button disabled="true" id="right-step">&#8594</button>
            </div> -->
        </div>
    </div>
</body>
<script>

    let boardSize = 0;
    let initialState = '';
    let goalState = '';
    let selectionMode = '';
    let jobId = null;
    let generation = 0;
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    function status(message) {
        document.getElementById('status').textContent = message;
    }

    function showState(state) {
        for (const [id, occupied] of Object.entries(state)) {
            const peg = document.getElementById(id);
            if (peg) peg.style.display = occupied ? 'block' : 'none';
        }
    }

    function initialBoard() {
        const state = {};
        for (let y = 0; y < boardSize; y++) {
            for (let x = 0; x <= y; x++) state[`p${x}-${y}`] = 1;
        }
        if (initialState) state[initialState] = 0;
        return state;
    }

    function stopSearch(showMessage = true) {
        generation += 1; // Invalidates old polls, delayed animation, and pending starts.
        const oldId = jobId;
        jobId = null;
        if (oldId) fetch('/cancel/' + oldId, {method: 'POST'}).catch(() => {});
        if (showMessage) {
            showState(initialBoard());
            status('Reset. Select a hole and goal, or run again.');
        }
    }

    function setInitialState() {
        stopSearch(false);
        selectionMode = 'initial';
        showState(initialBoard());
        status('Click the peg to remove at the start.');
    }

    function setGoalState() {
        stopSearch(false);
        selectionMode = 'goal';
        const state = initialBoard();
        for (const id of Object.keys(state)) state[id] = id === goalState ? 1 : 0;
        showState(state);
        status('Click the cell where the final peg should finish.');
    }

    function setBoardSize(value) {
        stopSearch(false);
        const size = Number(value);
        if (!Number.isInteger(size) || size < 2 || size > 10) {
            document.getElementById('run').disabled = true;
            status('Choose an integer board size from 2 to 10.');
            return;
        }
        boardSize = size;
        initialState = goalState = 'p0-0';
        selectionMode = '';
        const container = document.getElementById('board-container');
        container.replaceChildren();
        for (let y = 0; y < size; y++) {
            const row = document.createElement('div');
            row.className = 'board-row';
            for (let x = 0; x <= y; x++) {
                const id = `p${x}-${y}`;
                const cell = document.createElement('div');
                cell.className = 'board-cell';
                cell.title = `(${x}, ${y})`;
                const anchor = document.createElement('div');
                anchor.className = 'side-anchor';
                const peg = document.createElement('div');
                peg.id = id;
                peg.className = 'peg';
                anchor.appendChild(peg);
                cell.appendChild(anchor);
                cell.onclick = () => {
                    if (selectionMode === 'initial') initialState = id;
                    else if (selectionMode === 'goal') goalState = id;
                    else return;
                    selectionMode = '';
                    showState(initialBoard());
                    status(`Initial hole: ${initialState.slice(1)}; goal: ${goalState.slice(1)}.`);
                };
                row.appendChild(cell);
            }
            container.appendChild(row);
        }
        for (const id of ['initial-state', 'goal-state', 'live-switch', 'run', 'reset']) {
            document.getElementById(id).disabled = false;
        }
        showState(initialBoard());
        status('Ready. The initial hole and goal default to the top cell.');
    }

    async function run() {
        stopSearch(false);
        const ticket = generation;
        const live = document.getElementById('live-switch').checked;
        selectionMode = '';
        showState(initialBoard());
        status(live ? 'Searching live…' : 'Searching…');
        try {
            const response = await fetch(`/run/${boardSize}/${initialState}/${goalState}/${live}`);
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Could not start search.');
            if (ticket !== generation) {
                fetch('/cancel/' + result.job_id, {method: 'POST'}).catch(() => {});
                return;
            }
            jobId = result.job_id;
            await poll(ticket, jobId);
        } catch (error) {
            if (ticket === generation) status(error.message);
        }
    }

    async function poll(ticket, id) {
        while (ticket === generation) {
            const response = await fetch('/poll?job_id=' + encodeURIComponent(id));
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Could not read search.');
            if (ticket !== generation) return;
            if (result.live) showState(result.state);
            if (result.status === 'running') {
                await delay(150);
                continue;
            }
            jobId = null;
            if (result.status === 'solved') {
                if (!result.live) {
                    status('Solved. Replaying the solution…');
                    for (const state of result.states) {
                        await delay(500);
                        if (ticket !== generation) return;
                        showState(state);
                    }
                    showState(result.state);
                }
                status(`Solved in ${result.states.length} jumps.`);
            } else if (result.status === 'unsolved') {
                showState(initialBoard());
                status('No solution for this initial hole and goal.');
            } else {
                status(result.error || 'Search cancelled.');
            }
            return;
        }
    }

</script>
</html>
